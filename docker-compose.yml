services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${MEDIA_HOST_PATH:-/Users/alex/Media}:/media
    environment:
      MEDIA_ROOT: ${MEDIA_ROOT:-/media}
      APP_DATA_DIR: ${APP_DATA_DIR:-/media/.imageOrganizer}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
